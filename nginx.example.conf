# Minimal nginx reference config for Pixelian.
# Copy to /etc/nginx/sites-available/<your-site>.conf, edit paths,
# symlink into sites-enabled, and reload nginx.
#
# For production, add: HTTPS/SSL, HSTS, security headers, rate-limiting,
# and stricter dotfile rules. See GUIDE.md §9 for the full deployment
# checklist and §5.1 PRODUCTION CLEANUP for the docroot deletion step
# after this file has been copied.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP to HTTPS. Uncomment once SSL is configured.
    # return 301 https://$host$request_uri;

    # HTTPS listener. Uncomment alongside the redirect above.
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/ssl/certs/yourdomain.pem;
    # ssl_certificate_key /etc/ssl/private/yourdomain-key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;

    root /var/www/your-site/public;
    index index.php;

    charset utf-8;
    autoindex off;
    server_tokens off;
    client_max_body_size 8m;

    # SPA fallback. Every non-file request reaches index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM. Adjust the socket path for your PHP version.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Error routing. 4xx/5xx go to /?error=<code> so the SPA
    # ErrorDialog (core/error.js) handles them.
    error_page 400 = @err400;
    error_page 401 = @err401;
    error_page 403 = @err403;
    error_page 404 = @err404;
    error_page 500 = @err500;
    error_page 502 = @err502;
    error_page 503 = @err503;

    location @err400 { return 302 /?error=400; }
    location @err401 { return 302 /?error=401; }
    location @err403 { return 302 /?error=403; }
    location @err404 { return 302 /?error=404; }
    location @err500 { return 302 /?error=500; }
    location @err502 { return 302 /?error=502; }
    location @err503 { return 302 /?error=503; }

    # Data files. Cacheable JSON. 60s is enough that editing a file
    # reflects on the next reload without a hard refresh.
    location ^~ /data/ {
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    # Static assets. Short cache for code, long cache for media.
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Deny dotfiles (keep .well-known open for ACME / certbot).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}